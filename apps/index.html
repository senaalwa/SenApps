<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Jelajahi aplikasi yang dibuat oleh SenApps.">
  <title>Katalog Aplikasi — SenApps</title>
  <link rel="stylesheet" href="../assets/styles.css?v=3">
  <script src="../assets/scripts/catalog.js" defer></script>
</head>
<body>
  <header class="site-header shell">
    <a class="site-brand" href="../"><img src="../assets/senapps-logo.svg" alt=""><span>SenApps</span></a>
    <nav class="catalog-nav" aria-label="Navigasi utama">
      <a href="../">Beranda</a><a href="#catalog-list" aria-current="page">Aplikasi</a>
      <a href="mailto:senaalwaa@gmail.com">Kontak</a>
    </nav>
  </header>
  <main class="catalog-main shell">
    <section class="catalog-intro">
      <p class="eyebrow">Dari SenApps</p>
      <h1>Katalog aplikasi</h1>
      <p class="catalog-lead">Temukan aplikasi yang dirancang untuk membantu aktivitas sehari-hari.</p>
    </section>
    <section id="catalog-list" aria-labelledby="catalog-title">
      <h2 id="catalog-title" class="visually-hidden">Daftar aplikasi</h2>
      <div class="catalog-controls">
        <div class="search-field"><label for="app-search">Cari aplikasi</label><input id="app-search" type="search" placeholder="Nama, kategori, atau deskripsi" autocomplete="off"></div>
        <div class="filter-field"><label for="category-filter">Kategori</label><select id="category-filter"><option value="">Semua kategori</option></select></div>
      </div>
      <p id="catalog-status" class="catalog-status" role="status" aria-live="polite">Memuat katalog aplikasi…</p>
      <div id="app-grid" class="app-grid"></div>
    </section>
  </main>
  <footer class="site-footer shell"><span>© SenApps</span><a href="mailto:senaalwaa@gmail.com">Dukungan: senaalwaa@gmail.com</a></footer>
</body>
</html>
